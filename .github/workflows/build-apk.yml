name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Flutter project and copy sources
        run: |
          flutter create --org com.twincord --project-name fefo_inventory --platforms android app
          rm -rf app/lib
          cp -r lib app/lib
          cd app
          flutter pub add google_mlkit_text_recognition image_picker sqflite path intl

      - name: Configure Android (permissions, name, minSdk, disable R8)
        run: |
          cd app/android/app

          # Camera permission
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' src/main/AndroidManifest.xml

          # App name shown on the phone
          sed -i 's#android:label="fefo_inventory"#android:label="FEFO Inventory"#' src/main/AndroidManifest.xml

          # ML Kit needs a modern minSdk
          sed -i 's#flutter.minSdkVersion#24#' build.gradle.kts || true

          # Turn off R8 shrinking (fixes "Missing class ...mlkit...ChineseTextRecognizerOptions")
          cat >> build.gradle.kts <<'EOF'

          android {
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }
          EOF

          echo "----- build.gradle.kts -----"
          cat build.gradle.kts
          echo "----- AndroidManifest.xml -----"
          cat src/main/AndroidManifest.xml

      - name: Analyze (informational only)
        run: cd app && flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: cd app && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fefo-inventory-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
